<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | JDB Woodworks</title>
<meta name="description" content="Ready-to-ship handcrafted wood items from JDB Woodworks. Buy now with PayPal.">
<link rel="icon" href="images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Lora:ital,wght@0,400;0,500;1,400&amp;display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="store.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img src="images/logo.jpg" alt="JDB Woodworks logo">
      <span>JDB Woodworks</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="gallery.html">Gallery</a>
      <a href="store.html" aria-current="page">Shop</a>
      <a class="btn-line" href="index.html#quote">Request a quote</a>
    </nav>
  </div>
</header>

<main class="wrap store-main">
  <div class="eyebrow">Ready to ship</div>
  <h1 class="store-title">Shop</h1>
  <p class="lede">Handmade in the shop, in stock now. Pay with PayPal or a card. Want something custom? <a href="index.html#quote">Request a quote</a>.</p>

  <div id="store-status" class="store-note" role="status" hidden></div>
  <div id="products" class="products"></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="foot-brand">
      <img src="images/logo.jpg" alt="JDB Woodworks logo">
      <span>Custom wood furniture,<br>built by hand.</span>
    </div>
    <div class="copy">© JDB Woodworks. All rights reserved.</div>
